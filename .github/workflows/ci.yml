name: CI/CD

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

permissions:
    contents: read

env:
    NODE_VERSION: 20
    AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
    build-and-sonar:
        name: Build, SonarQube, and Trivy
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Check out source
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: |
                      properQuestServer/package-lock.json
                      PropertyQuestClient/package-lock.json

            - name: Cache SonarQube packages
              uses: actions/cache@v4
              with:
                  path: ~/.sonar/cache
                  key: ${{ runner.os }}-sonar
                  restore-keys: |
                      ${{ runner.os }}-sonar-

            - name: Cache Trivy database
              uses: actions/cache@v4
              with:
                  path: ~/.cache/trivy
                  key: ${{ runner.os }}-trivy-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-trivy-

            - name: Install backend dependencies
              working-directory: properQuestServer
              run: npm ci

            - name: Build backend
              working-directory: properQuestServer
              run: npm run build

            - name: Install frontend dependencies
              working-directory: PropertyQuestClient
              run: npm ci

            - name: Build frontend
              working-directory: PropertyQuestClient
              run: npm run build

            - name: Scan backend filesystem with Trivy
              uses: aquasecurity/trivy-action@0.28.0
              with:
                  scan-type: fs
                  scan-ref: properQuestServer
                  format: table
                  output: trivy-backend.txt
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true

            - name: Scan frontend filesystem with Trivy
              uses: aquasecurity/trivy-action@0.28.0
              with:
                  scan-type: fs
                  scan-ref: PropertyQuestClient
                  format: table
                  output: trivy-frontend.txt
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true

            - name: Upload Trivy reports
              uses: actions/upload-artifact@v4
              with:
                  name: trivy-reports
                  path: |
                      trivy-backend.txt
                      trivy-frontend.txt

            - name: SonarQube scan
              uses: SonarSource/sonarqube-scan-action@v2
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

            - name: SonarQube quality gate
              uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
              timeout-minutes: 10
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

    docker-build-push:
        name: Build and push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        outputs:
            ecr_registry: ${{ steps.login-ecr.outputs.registry }}
            image_tag: ${{ steps.image.outputs.tag }}
        steps:
            - name: Check out source
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-region: ${{ env.AWS_REGION }}
                  role-to-assume: ${{ secrets.OIDC }}

            - name: Log in to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Set image tag
              id: image
              run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

            - name: Build and push backend image
              uses: docker/build-push-action@v6
              with:
                  context: properQuestServer
                  file: properQuestServer/Dockerfile
                  push: true
                  tags: |
                      ${{ steps.login-ecr.outputs.registry }}/propertybackendimg:${{ steps.image.outputs.tag }}
                      ${{ steps.login-ecr.outputs.registry }}/propertybackendimg:latest

            - name: Build and push frontend image
              uses: docker/build-push-action@v6
              with:
                  context: PropertyQuestClient
                  file: PropertyQuestClient/Dockerfile
                  push: true
                  tags: |
                      ${{ steps.login-ecr.outputs.registry }}/propertyfrontendimg:${{ steps.image.outputs.tag }}
                      ${{ steps.login-ecr.outputs.registry }}/propertyfrontendimg:latest

    update-helm:
        name: Update Helm repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: docker-build-push
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out Helm repository
              uses: actions/checkout@v4
              with:
                  repository: ${{ secrets.HELM_REPO_USER }}/${{ vars.HELM_REPO_NAME || 'propertyquest-helm' }}
                  token: ${{ secrets.GITOPS_PAT }}
                  path: helm-repo

            - name: Install yq
              run: |
                  curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
                  chmod +x "$RUNNER_TEMP/yq"
                  echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

            - name: Update image and tag values
              working-directory: helm-repo
              env:
                  ECR_REGISTRY: ${{ needs.docker-build-push.outputs.ecr_registry }}
                  IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
              run: |
                  set -euo pipefail
                  values_file=helm/propertyquest/values.yaml

                  test -f "$values_file"
                  if yq -e '.backend.app and .frontend.app' "$values_file" >/dev/null; then
                    yq -i \
                      ".backend.app.image = \"${ECR_REGISTRY}/propertybackendimg\" | .backend.app.tag = \"${IMAGE_TAG}\" | .frontend.app.image = \"${ECR_REGISTRY}/propertyfrontendimg\" | .frontend.app.tag = \"${IMAGE_TAG}\"" \
                      "$values_file"
                  else
                    echo "Expected .backend.app and .frontend.app values in $values_file" >&2
                    exit 1
                  fi

            - name: Commit and push Helm change
              working-directory: helm-repo
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add helm/propertyquest/values.yaml
                  git diff --cached --quiet && exit 0
                  git commit -m "chore: update images to ${GITHUB_SHA}"
                  git push
